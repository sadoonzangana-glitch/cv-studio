<!-- شريط الألوان التفاعلي -->
<div class="color-palette-bar">
  <span style="font-size: 13px; font-weight: bold;">🎨 لون الثيم:</span>
  <button class="color-dot active" data-color="#1e3a8a" style="background: #1e3a8a;" title="أزرق ملكي"></button>
  <button class="color-dot" data-color="#0f766e" style="background: #0f766e;" title="أخضر زمردي"></button>
  <button class="color-dot" data-color="#831843" style="background: #831843;" title="عنابي"></button>
  <button class="color-dot" data-color="#334155" style="background: #334155;" title="رمادي احترافي"></button>
  <button class="color-dot" data-color="#581c87" style="background: #581c87;" title="بنفسجي ملكي"></button>
  <button class="color-dot" data-color="#b45309" style="background: #b45309;" title="برونزي / كهرماني"></button>
  <input type="color" id="customColorPicker" title="اختر لون مخصص" style="width: 24px; height: 24px; border: none; cursor: pointer; border-radius: 50%;" />
</div>
